<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <script id="pwa-install-capture">
    // Capture before async modules load: browsers may emit this only once.
    window.gplxInstall = { prompt: null, installed: false };
    window.addEventListener('beforeinstallprompt', event => {
      event.preventDefault();
      window.gplxInstall.prompt = event;
    });
    window.addEventListener('appinstalled', () => {
      window.gplxInstall.prompt = null;
      window.gplxInstall.installed = true;
    });
  </script>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b3434">
  <meta name="description" content="Học 600 câu hỏi GPLX, ôn điểm liệt, tra cứu biển báo và luyện đề. Lưu tiến độ và học ngoại tuyến.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css?v=gplx-shell-v7">
  <title>Ôn thi GPLX · Học vững, lái an tâm</title>
</head>
<body>
  <a class="skip-link" href="#main">Đến nội dung</a>
  <aside id="sidebar" class="sidebar">
    <a class="brand" href="#home"><span class="brand-icon">↟</span><span>GPLX<span class="brand-sub">HỌC VỮNG. LÁI AN TÂM.</span></span></a>
    <p class="nav-caption">KHÔNG GIAN HỌC TẬP</p>
    <nav aria-label="Điều hướng chính" id="nav"></nav>
    <div class="sidebar-bottom"><span class="status-dot"></span><span id="connection-label">Đang trực tuyến</span><small>Tiến độ lưu trên thiết bị của bạn</small></div>
  </aside>
  <div class="workspace">
    <header class="topbar">
      <div class="breadcrumb">Góc học tập <span>/</span> <strong id="page-label">Tổng quan</strong></div>
      <div class="header-actions"><button class="quiet-button install-button" id="install-button">Cài ứng dụng <span>↗</span></button><span class="profile" aria-label="Hồ sơ cá nhân">BẠN</span></div>
    </header>
    <main id="main" tabindex="-1"><div class="loading">Đang mở bộ câu hỏi…</div></main>
    <footer><span>Ôn thi GPLX · Không gian học tập cá nhân</span><button class="text-button" data-action="about">Nguồn dữ liệu & cài đặt</button></footer>
  </div>
  <nav id="bottom-nav" class="bottom-nav" aria-label="Điều hướng nhanh"></nav>
  <dialog id="modal"><div id="modal-content"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module">
    // Update the worker even if an application module fails before init().
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).catch(() => {});
    }
    function startupError() {
      const main = document.querySelector('#main');
      const message = document.createElement('p');
      message.textContent = 'Chưa tải được ứng dụng. Kiểm tra kết nối và tải lại trang. Nếu vừa cập nhật, hãy tải lên đầy đủ thư mục dist.';
      const retry = document.createElement('button');
      retry.className = 'primary'; retry.textContent = 'Tải lại ứng dụng';
      retry.addEventListener('click', () => location.reload());
      main.replaceChildren(message, retry);
    }
    const startupTimer = setTimeout(startupError, 20000);
    import('./app.js?v=gplx-shell-v7').catch(error => {
      console.error('GPLX startup failed:', error);
      startupError();
    }).finally(() => clearTimeout(startupTimer));
  </script>
</body>
</html>
